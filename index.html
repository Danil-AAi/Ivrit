<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Иврит">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1522" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Иврит-карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
button,.card,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* Layout: one column "study desk" — mode tabs, topic chips, then one index card in the middle; Leitner box number in the card corner */
:root{
  --bg:#E9EDF2; --paper:#FFFFFF; --ink:#16233F; --muted:#5D6A82; --line:#D3DAE5;
  --accent:#2350C8; --accent-soft:#DCE5FB; --ok:#1F8A5B; --ok-soft:#D9F1E5; --err:#C23B3B; --err-soft:#F8DEDE;
  --rule:#C9D6F2;
  --f-he:"Frank Ruhl Libre","Noto Serif Hebrew","David",serif;
  --f-ui:"Rubik","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --paper:#18213A; --ink:#E6EBF5; --muted:#93A0BA; --line:#2A3655;
  --accent:#7C9BFF; --accent-soft:#25335E; --ok:#4FC490; --ok-soft:#173A2C; --err:#F07A7A; --err-soft:#432124; --rule:#26345A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --paper:#18213A; --ink:#E6EBF5; --muted:#93A0BA; --line:#2A3655;
  --accent:#7C9BFF; --accent-soft:#25335E; --ok:#4FC490; --ok-soft:#173A2C; --err:#F07A7A; --err-soft:#432124; --rule:#26345A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
h1 .he{font-family:var(--f-he);font-weight:700;font-size:26px;color:var(--accent)}
.stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:500 14px var(--f-ui);padding:9px 6px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0F1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0F1522}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:400 13px var(--f-ui);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* index card */
.card{position:relative;height:300px;cursor:pointer}
.card .back{display:none}
.card.flipped .front{display:none}
.card.flipped .back{display:flex;animation:flipin .28s ease-out}
@keyframes flipin{from{opacity:0;transform:scaleX(.7)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 0 var(--line),0 10px 28px -14px rgba(20,35,70,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:10px;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:52px;border-top:2px solid var(--err);opacity:.35}
.face::after{content:"";position:absolute;inset:54px 0 0;background:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);opacity:.6;pointer-events:none}
.face>*{position:relative;z-index:1}
.corner{position:absolute;top:16px;font-size:12px;color:var(--muted);z-index:1}
.corner.l{left:18px}.corner.r{right:18px}
.word{font-family:var(--f-he);font-weight:500;font-size:clamp(46px,13vw,68px);line-height:1.15;direction:rtl}
.tr{font-size:17px;color:var(--muted)}
.ru{font-size:clamp(24px,7vw,32px);font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.say{border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;font:500 13px var(--f-ui);padding:5px 12px;cursor:pointer}
.boxes{display:flex;gap:3px}
.boxes i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 15px var(--f-ui);padding:14px;border-radius:10px;cursor:pointer}
.btn.no{color:var(--err);border-color:var(--err-soft)}
.btn.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.btn kbd{font:12px var(--f-ui);opacity:.6;margin-left:6px}

/* quiz */
.q{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.q .ru{font-size:30px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 10px;cursor:pointer;font:500 16px var(--f-ui);min-height:64px;min-width:0;overflow-wrap:anywhere}
.ans.he{font-family:var(--f-he);font-size:26px;direction:rtl}
.ans.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ans.bad{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.ans:disabled{cursor:default}
.qbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--muted);font:500 12px var(--f-ui);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.next{align-self:center}

/* dictionary */
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:15px var(--f-ui)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child,.vd:first-child .item{border-top:0}
.vd{border-top:1px solid var(--line)}.vd:first-child{border-top:0}.vd>summary{list-style:none;cursor:pointer;border-top:0}.vd>summary::-webkit-details-marker{display:none}
.more{font-size:11px;font-weight:400;color:var(--accent);margin-left:4px}
.vfull{padding:4px 14px 16px;display:flex;flex-direction:column;gap:10px}
.vinf{font-size:13px;color:var(--muted)}.vinf span{font-family:var(--f-he);font-size:18px;color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.vt{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow-x:auto;min-width:0}
.vth{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.vt table{width:100%;border-collapse:collapse}
.vt td{padding:5px 10px;border-top:1px solid var(--line);white-space:nowrap}
.vt .pn{font-family:var(--f-he);font-size:14px;color:var(--muted)}
.vt .fh{font-family:var(--f-he);font-size:19px}
.vt .ft{font-size:12px;color:var(--muted);text-align:left}
.vt tr.cur td{background:var(--ok-soft)}.vt tr.cur .fh{color:var(--ok);font-weight:700}
.tense{color:var(--accent);font-weight:600}
.item .h{font-family:var(--f-he);font-size:24px;direction:rtl;text-align:right;order:3}
.item .m{min-width:0}
.item .m b{font-weight:500;display:block}
.item .m span{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:12px var(--f-ui);cursor:pointer;padding:0}
.confirm{display:flex;gap:8px;align-items:center}
.sent{display:flex;gap:10px;align-items:baseline;direction:rtl;margin-top:6px}
.sent .word{font-size:34px}
.blank{font-size:26px;color:var(--accent);letter-spacing:.1em}
.ctab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;direction:rtl}
.ctab>div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ctab>div.cur{border-color:var(--ok);background:var(--ok-soft)}
.fn{font-size:11px;color:var(--muted)}.fh{font-family:var(--f-he);font-size:20px}.ft{font-size:12px;color:var(--muted)}
@media (max-width:440px){.ctab{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{font-size:13px;padding:9px 2px}}
@media (prefers-reduced-motion:reduce){.card.flipped .back{animation:none}}
</style>
</head>

<div class="wrap">
  <header>
    <h1><span class="he" lang="he">עִבְרִית</span> Иврит-карточки</h1>
    <div class="stat" id="stat"></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-cards" aria-selected="true" data-mode="cards">Карточки</button>
    <button role="tab" id="t-quiz" aria-selected="false" data-mode="quiz">Тест</button>
    <button role="tab" id="t-conj" aria-selected="false" data-mode="conj">Спряжение</button>
    <button role="tab" id="t-dict" aria-selected="false" data-mode="dict">Словарь</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="opts">
    <label><input type="checkbox" id="niq" checked> Огласовки (никуд)</label>
    <label><input type="checkbox" id="trs" checked> Транскрипция</label>

  <section id="v-cards"></section>

  <section id="v-conj" hidden></section>
  <section id="v-dict" hidden></section>

    <span id="reset"></span>
  </div>
</div>

let last=null;

  const p=pool().filter(w=>w!==last||pool().length<2);
  let tot=0;const ws=p.map(w=>{const x=(6-lv(w))**2;tot+=x;return x});
  let r=Math.random()*tot;for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0)return last=p[i]}
  return last=p[p.length-1];
}

/* quiz */
let q=null,score={ok:0,all:0,streak:0};
function quiz(newQ){
  if(newQ||!q){const w=pick();const p=pool().length>=4?pool():W;
    const opts=[w];while(opts.length<4){const o=p[Math.floor(Math.random()*p.length)];if(!opts.includes(o)&&o.ru!==w.ru)opts.push(o)}
    opts.sort(()=>Math.random()-.5);q={w,opts,done:false}}
  const he=st.dir==="he",w=q.w;
  $("v-quiz").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="qbar"><div class="seg"><button id="d-he" aria-pressed="${he}">иврит → русский</button><button id="d-ru" aria-pressed="${!he}">русский → иврит</button></div>
      <span>Верно ${score.ok} из ${score.all} · серия ${score.streak}</span></div>
    <div class="q"><span class="hint">${catLabel(w)}</span>
      ${he?`<div class="word" lang="he">${esc(heTxt(w))}</div>${st.trs?`<div class="tr">${esc(w.tr)}</div>`:""}`:`<div class="ru">${esc(w.ru)}</div>`}
      <button class="say" id="say" ${he?"":"hidden"}>▶ Произнести</button></div>
    <div class="answers">${q.opts.map((o,i)=>`<button class="ans ${he?"":"he"}" id="a${i}" data-i="${i}" ${he?"":'lang="he"'}>${esc(he?o.ru:heTxt(o))}</button>`).join("")}</div>
    <button class="btn next" id="nextq" hidden>Дальше →</button></div>`;
  $("d-he").onclick=()=>{st.dir="he";save();quiz(true)};$("d-ru").onclick=()=>{st.dir="ru";save();quiz(true)};
  $("say").onclick=()=>speak(w.he);
  document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $("nextq").onclick=()=>quiz(true);
}
function answer(i){
  if(q.done)return;q.done=true;const o=q.opts[i],ok=o===q.w;
  score.all++;if(ok){score.ok++;score.streak++;setLv(q.w,lv(q.w)+1)}else{score.streak=0;setLv(q.w,0)}
  q.opts.forEach((x,j)=>{const b=$("a"+j);b.disabled=true;if(x===q.w)b.classList.add("good");else if(j===i)b.classList.add("bad")});
  if(!ok){const b=$("a"+q.opts.indexOf(q.w));if(st.dir==="ru")b.innerHTML+=`<div style="font:13px var(--f-ui)">${esc(q.w.tr)}</div>`}
  document.querySelector(".qbar span").textContent=`Верно ${score.ok} из ${score.all} · серия ${score.streak}`;
  if(ok)setTimeout(()=>{if(st.mode==="quiz"&&q.done)quiz(true)},900);else $("nextq").hidden=false;
}

    const others=[...new Set(F.map(x=>x.h))].filter(h=>h!==correct).sort(()=>Math.random()-.5).slice(0,3);
    cq={v,t,pr,ci,correct,opts:[correct,...others].sort(()=>Math.random()-.5),done:false}}
  const {v,pr,t}=cq;const allB=st.bins.length===Object.keys(BIN).length;
  $("v-conj").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="qbar"><div class="seg">${[["pres","Наст."],["past","Прош."],["fut","Буд."],["all","Все"]].map(([k,n])=>`<button data-t="${k}" aria-pressed="${st.tense===k}">${n}</button>`).join("")}</div>
      <span id="cscore">Верно ${cs.ok} из ${cs.all} · серия ${cs.streak}</span></div>
    <div class="chips">${`<button class="chip" id="b-all" aria-pressed="${allB}">Все биньяны</button>`+Object.entries(BIN).map(([k,n])=>`<button class="chip" id="b-${k}" data-b="${k}" aria-pressed="${!allB&&st.bins.includes(k)}">${n}</button>`).join("")}</div>
    <div class="q"><span class="hint">${BIN[v.b]} · <b class="tense">${TN[t]} время</b></span>
      <div class="ru">${esc(v.ru)}</div><div class="word" lang="he" style="font-size:30px">${esc(heTxt(v))}</div>
      <div class="sent"><span class="word" lang="he">${esc(st.niq?pr[0]:strip(pr[0]))}</span><span class="blank" lang="he">＿＿＿</span></div>
      <div class="tr">${pr[1]}</div></div>
    <div class="answers">${cq.opts.map((h,i)=>`<button class="ans he" id="ca${i}" data-i="${i}" lang="he">${esc(h)}</button>`).join("")}</div>
    <div id="ctab" hidden></div>
    <button class="btn next" id="nextc" hidden>Дальше →</button></div>`;
  document.querySelectorAll("#v-conj .seg button").forEach(b=>b.onclick=()=>{st.tense=b.dataset.t;save();conj(true)});
  document.querySelectorAll("#v-conj .chip").forEach(b=>b.onclick=()=>{
    const all=st.bins.length===Object.keys(BIN).length,k=b.dataset.b;
    if(!k)st.bins=Object.keys(BIN);else if(all)st.bins=[k];
    else if(st.bins.includes(k)){st.bins=st.bins.filter(x=>x!==k);if(!st.bins.length)st.bins=Object.keys(BIN)}else st.bins.push(k);
    save();conj(true)});
  document.querySelectorAll("#v-conj .ans").forEach(b=>b.onclick=()=>cAnswer(+b.dataset.i));
  $("nextc").onclick=()=>conj(true);
}
function cAnswer(i){
  if(!cq||cq.done||i>=cq.opts.length)return;cq.done=true;const ok=cq.opts[i]===cq.correct;
  cs.all++;if(ok){cs.ok++;cs.streak++}else cs.streak=0;
  cq.opts.forEach((h,j)=>{const b=$("ca"+j);b.disabled=true;if(h===cq.correct)b.classList.add("good");else if(j===i)b.classList.add("bad")});
  $("ctab").hidden=false;$("ctab").innerHTML=tenseTable(cq.v,cq.t,cq.ci);
  $("cscore").textContent=`Верно ${cs.ok} из ${cs.all} · серия ${cs.streak}`;
  speak(cq.correct);$("nextc").hidden=false;$("nextc").focus();
}

function render(reset){
  $("chips").hidden=st.mode==="conj";
  ["cards","quiz","conj","dict"].forEach(m=>{$("v-"+m).hidden=m!==st.mode;$("t-"+m).setAttribute("aria-selected",m===st.mode)});
  if(st.mode==="cards")cards(reset);else if(st.mode==="quiz")quiz(reset);else if(st.mode==="conj")conj(reset);else dict();
}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.mode=b.dataset.mode;save();render(false)};
$("niq").checked=st.niq;$("trs").checked=st.trs;
$("niq").onchange=e=>{st.niq=e.target.checked;save();render(false)};
$("trs").onchange=e=>{st.trs=e.target.checked;save();render(false)};

function resetUI(confirming){
  $("reset").innerHTML=confirming?`<span class="confirm">Стереть прогресс? <button class="link" id="ry">Да</button><button class="link" id="rn">Нет</button></span>`:`<button class="link" id="r0">Сбросить прогресс</button>`;
  if(confirming){$("ry").onclick=()=>{st.lv={};save();stat();render(false);resetUI(false)};$("rn").onclick=()=>resetUI(false)}
  else $("r0").onclick=()=>resetUI(true);
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(st.mode==="cards"){if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
    else if(e.key==="1")$("no").click();else if(e.key==="2")$("yes").click()}
  else if(st.mode==="quiz"){if(/^[1-4]$/.test(e.key))answer(+e.key-1);else if(e.key==="Enter"&&q.done)quiz(true)}
  else if(st.mode==="conj"){if(/^[1-4]$/.test(e.key))cAnswer(+e.key-1);else if(e.key==="Enter"&&cq&&cq.done)conj(true)}
});
chips();stat();resetUI(false);render(true);
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
